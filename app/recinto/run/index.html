<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Recinto</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hud">
    <span class="hud-item"><b id="quota">0%</b><small>di <span id="goal">70%</span></small></span>
    <span class="hud-item"><b id="score">0</b><small>punti</small></span>
    <span class="hud-item"><b id="lives">3</b><small>vite</small></span>
    <span class="hud-item"><b id="level">1</b><small id="arena">rettangolo</small></span>
  </header>

  <main class="field">
    <canvas id="canvas"></canvas>
    <p id="banner" class="banner" hidden></p>
  </main>

  <footer class="controls">
    <button id="stroke" type="button" aria-pressed="false">Tratto lento <b>×2</b></button>
    <button id="again" type="button">Ricomincia</button>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
