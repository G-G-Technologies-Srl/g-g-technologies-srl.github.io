<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Scope</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0d1220">
<meta name="description" content="Organise projects, pages and deadlines in one place, entirely in your browser.">
<link rel="canonical" href="https://ggtechnologies.sm/app/plan-scope/">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="../../_lib/base.css">
<link rel="stylesheet" href="../../_lib/plan-editor.css">
<link rel="stylesheet" href="./styles.css">
<script>
  // Before the first paint, on purpose. Applied from a module it would run after the stylesheet,
  // and the app would flash dark and then jump to light at every start.
  try {
    var saved = localStorage.getItem('gg-theme');
    var light = saved ? saved === 'light'
      : window.matchMedia('(prefers-color-scheme: light)').matches;
    if (light) {
      document.documentElement.setAttribute('data-theme', 'light');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f8fc');
    }
  } catch (ignored) {}
</script>
<script>
  // `beforeinstallprompt` waits for nobody: on a second visit, with the service worker already
  // active, Chrome fires it before any module has finished loading, and a listener registered from
  // app.js never sees it. Caught here and left in a global, which gg/install.js reads on setup.
  window.addEventListener('beforeinstallprompt', function (event) {
    event.preventDefault();
    window.__ggInstallPrompt = event;
  });
</script>
</head>
<body>

<!-- One bar, and one command in it that is not a setting: the way home. Installed, the app runs in
     a standalone window with no back button, so a screen you can enter and not leave is a screen
     that traps somebody. It appears only when you are not already home, and it asks nothing before
     leaving: everything is saved as it is typed, so there is nothing to lose and a confirmation
     would suggest otherwise. -->
<header>
  <div class="appbar">
    <span class="brand-block"><span class="brand">Plan Scope</span><button type="button" class="gg-version" id="appVersion" hidden></button></span>
    <span class="meta" id="tagline"></span>
    <!-- After the tagline, not between it and the name: name and tagline are one thing, the way
         back is another. «Progetti», the word of the screen it goes to. -->
    <span class="spacer"></span>
    <!-- One box, every project. The lens is in the bar because the question it answers — where
         did I write that — comes up on every screen, not on one. -->
    <button type="button" id="search" class="ghost small icon" data-t-label="searchLabel">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="11" cy="11" r="6"></circle>
        <path d="M20 20l-4.5-4.5"></path>
      </svg>
    </button>
    <!-- La rubrica stava fra «Importa» e «Cestino», cioè fra le cose che si fanno una volta ogni
         tanto, e si apre invece tutti i giorni: chi non apriva il menù non sapeva che ci fosse.
         Qui sta accanto alla lente, che risponde all'altra domanda di ogni schermata: «chi era?». -->
    <button type="button" id="openRubrica" class="ghost small icon" data-t-label="rubricaTitle"
            data-t-title="rubricaTitle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="9" r="3.2"></circle>
        <path d="M3.5 19c0-3 2.5-4.6 5.5-4.6s5.5 1.6 5.5 4.6"></path>
        <path d="M16 6.2a3.2 3.2 0 0 1 0 6.1M17.5 19c0-2.2-.9-3.7-2.4-4.5"></path>
      </svg>
    </button>
    <button type="button" id="install" class="ghost small" hidden></button>
    <!-- The awards are an accessory, not a function: they sit up here with the sound — the other
         half of the same game — and not among the commands of the archive, where a person looking
         for «Importa» found a trophy. -->
    <button type="button" id="openAwards" class="ghost small icon" data-t-label="awardsTitle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3.5l2.6 5.3 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8L3.5 9.6l5.9-.8z"></path>
      </svg>
    </button>
    <!-- A setting, so it lives with the settings: language and theme are here, and a checkbox in a
         row of commands on the archive was a setting pretending to be an action. -->
    <button type="button" id="soundOn" class="ghost small icon" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
        <path class="sound-wave" d="M16 9a4 4 0 0 1 0 6"></path>
      </svg>
    </button>
    <button type="button" id="lang" class="ghost small"></button>
    <button type="button" id="theme" class="ghost small icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"></path>
      </svg>
    </button>

    <!-- I comandi dell'archivio, che prima stavano in fila in fondo alla schermata: cinque pulsanti
         e un numero, sotto la piega su un portatile, e solo lì. Sono cose che si fanno una volta
         ogni tanto — importare, esportare, aprire il cestino — e stanno dove l'app tiene già quello
         che si apre di rado. Stesso componente della barra della pagina e di quella del piano. -->
    <div class="more">
      <button type="button" id="appMore" class="primary small icon" aria-haspopup="true" aria-expanded="false" data-t-label="appMoreLabel">⋯</button>
      <div class="more-menu" id="appMoreMenu" hidden>
        <button type="button" id="importProject" data-t="importProject"></button>
        <button type="button" id="backupAll" data-t="backupAll"></button>
        <button type="button" id="openRemind" data-t="remindTitle"></button>
        <button type="button" id="openTrash" data-t="openTrash"></button>
        <!-- Una voce sola per le due cartelle, perché portano allo stesso posto. Solo dove il
             browser sa consegnare una cartella (Chromium, sul computer). -->
        <button type="button" id="openPlaces" data-t="placesTitle" hidden></button>
        <!-- The guide is a project like the others; this makes it, once, and opens it. Chosen as a
             template it was found by the few who read template names. -->
        <button type="button" id="openGuide" data-t="openGuide"></button>
      </div>
    </div>
  </div>
  <p class="hint" id="installHint" hidden></p>
</header>

<main>

  <!-- Dove sei, e come si risale.
       Quattro pulsanti dicevano «su» — «Progetti» nella barra, «Torna al progetto» due volte
       identiche, «Torna» dalle pagine — e nessuno diceva dove fossi. Questa riga fa tutt'e due, e
       conta più di una comodità: installata, l'app gira in una finestra senza il pulsante indietro
       del browser, quindi la risalita che disegna l'app è l'unica che c'è. -->
  <div class="topbars">
    <nav class="crumbs" id="crumbs" data-t-label="crumbsLabel" hidden></nav>

    <!-- Come guardi questo progetto: quattro modi, una domanda sola, nello stesso posto su tutte
         le sue schermate. Prima le prime tre stavano nella barra del piano e la quarta da
         un'altra parte, ed erano la stessa domanda fatta in due posti con parole diverse.
         Sulla pagina no: lì sei dentro un documento, e per uscirne basta la riga sopra. -->
    <nav class="views" id="views" data-t-label="viewsLabel" hidden>
      <button type="button" id="goBoard" data-t="viewKanban"></button>
      <button type="button" id="goCalendar" data-t="viewCalendar"></button>
      <button type="button" id="goTimeline" data-t="viewTimeline"></button>
      <button type="button" id="goPages" data-t="treePages"></button>
    </nav>
  </div>

  <!-- ------------------------------------------------------------------ archive -->

  <section class="screen" id="home">
    <div class="wrap">
      <div class="screen-head">
        <h1 data-t="homeTitle"></h1>
        <span class="spacer"></span>
        <!-- Le due porte scritte, qui e non solo nella barra. L'icona lassù serve a chi è dentro un
             progetto e vuole la rubrica senza tornare indietro; ma in archivio la rubrica va
             **letta**, perché un profilo disegnato in sedici pixel lo riconosce solo chi sa già
             che c'è — che è lo stesso difetto del menù ⋯ da cui la rubrica è appena uscita. -->
        <button type="button" id="openRubricaHome" data-t="rubricaTitle"></button>
        <!-- Il mese intero, da qui: il pannello sotto guarda sette giorni, e la domanda «e dopo?»
             non aveva un posto dove andare. -->
        <button type="button" id="openAgenda" data-t="agendaTitle"></button>
        <button type="button" id="newProject" class="primary" data-t="newProject"></button>
      </div>
      <!-- Uno stato, non un comando: in fondo a una fila di pulsanti sembrava uno di loro. -->
      <p class="note" id="storage"></p>

      <form class="card form" id="newProjectForm" hidden>
        <label for="projectName" data-t="projectNameLabel"></label>
        <input type="text" id="projectName" maxlength="80" autocomplete="off">
        <!-- Una data, e come si chiama. Qui c'era «Data dell'evento», addosso a ogni progetto:
             per una fiera voleva dire qualcosa, per un progetto di sviluppo o di documenti no. Il
             nome lo scrive chi fa il progetto, e diventa una proprietà come le altre. -->
        <span class="field-label" id="projectDateLabel"></span>
        <div class="date-field">
          <input type="text" id="projectDateKey" class="prop-key" maxlength="40" autocomplete="off"
                 list="projectDateKeys" data-t-placeholder="projectDateKeyHint"
                 data-t-label="projectDateKeyHint">
          <input type="date" id="projectDate" data-t-label="projectDateHint">
        </div>
        <datalist id="projectDateKeys"></datalist>
        <!-- The templates, and they are the first thing this app can do for somebody who has never
             organised anything in it: a project that already knows what it is. -->
        <span class="field-label" id="templateLabel"></span>
        <div class="template-choice" id="templateChoice"></div>
        <div class="row">
          <button type="submit" id="createProject" class="primary" data-t="createProject"></button>
          <button type="button" id="cancelProject" data-t="cancelProject"></button>
        </div>
      </form>

      <!-- What the morning asks first — not "which projects do I have" but "what is due". One
           list across every project, late first, and it is the reason to open the app at all. -->
      <div class="card today" id="todayPanel" hidden>
        <!-- The week, and the way to everything after it: the panel stops at seven days. -->
        <div class="today-head">
          <h2 data-t="todayTitle"></h2>
          <button type="button" id="todayCalendar" class="link" data-t="todayCalendar"></button>
        </div>
        <div class="due-groups" id="todayList"></div>
        <p class="note" id="todayEmpty" data-t="todayEmpty" hidden></p>
      </div>

      <p class="empty" id="homeEmpty" data-t="homeEmpty" hidden></p>
      <!-- Le etichette accese, ognuna con la sua croce, e un modo di togliere tutto in un colpo.
           La stessa riga che ha la tabella delle pagine, perché è la stessa domanda: «fammi vedere
           solo questi». Sparisce quando non c'è niente di acceso. -->
      <!-- How the cards are ordered and drawn. Last change first by default: a project without
           dates is opened to pick up where it was left, and that is the one to find first. -->
      <div class="home-tools" id="homeTools" hidden>
        <span class="field-label" data-t="homeSortLabel"></span>
        <div class="views home-switch" id="homeSort" role="group" data-t-label="homeSortLabel">
          <button type="button" data-sort="recent" data-t="homeSortRecent"></button>
          <button type="button" data-sort="due" data-t="homeSortDue"></button>
          <button type="button" data-sort="name" data-t="homeSortName"></button>
        </div>
        <span class="spacer"></span>
        <input type="search" id="projectSearch" autocomplete="off" data-t-placeholder="projectSearch" data-t-label="projectSearch" hidden>
        <button type="button" id="showArchived" class="ghost small" hidden></button>
        <div class="views home-switch" id="homeView" role="group" data-t-label="homeViewLabel">
          <button type="button" data-view="cards" data-t="homeViewCards"></button>
          <button type="button" data-view="list" data-t="homeViewList"></button>
        </div>
      </div>
      <div class="filters" id="projectFilters" hidden></div>
      <div class="cards" id="projectList"></div>
      <p class="empty" id="projectsFiltered" data-t="projectsFiltered" hidden></p>
      <p class="empty" id="projectsNoName" data-t="projectsNoName" hidden></p>
      <!-- The finished projects, set aside: under the rest, and only when asked for. -->
      <section class="archived-section" id="archivedSection" hidden>
        <h2 data-t="archivedTitle"></h2>
        <div class="cards" id="archivedList"></div>
      </section>

      <!-- The folder's state, when there is one: its name, who we are, when it was last read; and
           the button to take the permission up again when the browser dropped it. -->
      <p class="note folder-line" id="folderLine" hidden>
        <span id="folderText"></span>
        <button type="button" id="folderResume" class="ghost small" data-t="folderSeeAll" hidden></button>
      </p>

      <!-- E la sua, con lo stesso disegno: dove scrive, quand'è l'ultima copia, e il pulsante per
           riprendere il permesso quando il browser l'ha lasciato cadere. -->
      <p class="note folder-line" id="backupLine" hidden>
        <span id="backupText"></span>
        <button type="button" id="backupResume" class="ghost small" data-t="backupResume" hidden></button>
      </p>

      <!-- Once, and not every time: the nudge shows when the last backup is over two weeks old, and
           «Va bene» silences it for another two. A reminder that repeats is a nag. -->
      <p class="note invite" id="exportNudge" hidden>
        <span data-t="exportNudge"></span>
        <button type="button" id="exportNudgeOk" class="ghost small" data-t="exportNudgeOk"></button>
      </p>
      <p class="note" id="noStore" hidden></p>
    </div>
  </section>

  <!-- ------------------------------------------------------------------ one project -->

  <!-- The dashboard of one project. Every panel answers one question and opens the screen that
       answers it in full; what needs doing now comes first, and says so in a fixed order. -->
  <section class="screen" id="project" hidden>
    <div class="wrap">
      <!-- The example says it is one, for as long as it exists. The welcome dialog says it once;
           this is what somebody sees when they come back tomorrow having forgotten. -->
      <p class="note invite" id="demoStrip" hidden>
        <span data-t="demoStrip"></span>
        <button type="button" id="demoDrop" class="ghost small" data-t="demoDrop"></button>
      </p>
      <p class="kicker" id="projectWhen"></p>
      <!-- The export sits beside the title and not at the foot of the screen: on a laptop the foot
           is below the fold, and the one habit that protects everything somebody makes here should
           not need a scroll to find. -->
      <div class="screen-head">
        <h1 id="projectTitle"></h1>
        <button type="button" id="exportProject" class="accent" data-t="exportProject"></button>
      </div>

      <!-- La testa del progetto: le etichette e gli attributi, dentro una colonna della larghezza
           di un testo. Gli stessi due pezzi che una pagina ha sopra il suo corpo, con lo stesso
           editore — quindi anche gli stessi selettori, il calendario e la pastiglia del colore. Un
           progetto non è un file, quindi qui stanno nel record invece che in una testa di testo. -->
      <div class="project-head">
        <input type="text" id="projectTags" class="tags-field" maxlength="160" autocomplete="off"
               list="projectTagList" data-t-label="projectTagsLabel" data-t-placeholder="projectTagsLabel">
        <datalist id="projectTagList"></datalist>
        <div class="props" id="projectProps"></div>
        <button type="button" id="projectPropAdd" class="ghost small prop-add" data-t="propAdd"></button>
        <datalist id="projectPropKeys"></datalist>
      </div>

      <!-- Two columns and a reading order. The left one answers "what now" and "how far along":
           what needs doing, the plan, the next four weeks, the meetings had. The right one holds
           what is looked up: the next meeting, the decisions, what we are waiting for, the people,
           the documents. On a phone the columns dissolve into one list, in the order the `order`
           rules in styles.css give it, which is not the order of this markup. -->
      <div class="project-cols">
        <div class="project-main">

          <!-- What needs doing now: at most five rows, in a fixed order, then "and n more". -->
          <section class="card panel-now" id="panelNow">
            <div class="panel-head">
              <h2 data-t="nowTitle"></h2>
              <span class="spacer"></span>
              <button type="button" id="nowGo" class="link small" data-t="nowGo"></button>
            </div>
            <div class="now-sum" id="nowSum"></div>
            <ul class="list now-list" id="nowList"></ul>
            <button type="button" id="nowMore" class="link small now-more" hidden></button>
            <div class="now-quiet" id="nowQuiet" hidden></div>
          </section>

          <section class="card panel-plan" id="panelPlan">
            <div class="panel-head">
              <h2 data-t="planTitle"></h2>
              <span class="meta" id="planCount"></span>
              <span class="spacer"></span>
              <button type="button" id="openPlan" class="link small" data-t="panelPlan"></button>
            </div>
            <div class="plan-bar" id="planBar" role="img"></div>
            <ul class="plan-legend" id="planLegend"></ul>
            <p class="plan-milestone" id="planMilestone" hidden></p>
            <p class="note" id="tasksEmpty" data-t="tasksEmpty" hidden></p>
            <form class="row quick-add" id="newTaskForm">
              <input type="text" id="taskField" maxlength="160" autocomplete="off">
              <button type="submit" id="addTask" class="primary" data-t="addTask"></button>
            </form>
          </section>

          <section class="card panel-weeks" id="panelWeeks">
            <div class="panel-head">
              <h2 id="weeksTitle"></h2>
              <span class="spacer"></span>
              <button type="button" id="dueGo" class="link small" data-t="panelCalendar"></button>
            </div>
            <div class="weeks" id="weeks"></div>
            <p class="note" id="weeksEmpty" data-t="weeksEmpty" hidden></p>
            <ul class="weeks-legend" id="weeksLegend"></ul>
            <p class="note weeks-undated" id="weeksUndated" hidden></p>
          </section>

          <section class="card panel-met" id="panelMet">
            <div class="panel-head">
              <h2 data-t="metTitle"></h2>
              <span class="spacer"></span>
              <button type="button" id="metGo" class="link small" data-t="metGo"></button>
            </div>
            <ul class="list met-list" id="metList"></ul>
            <p class="note" id="metEmpty" data-t="metEmpty" hidden></p>
          </section>
        </div>

        <aside class="project-side">
          <!-- The next meeting, and what to bring to it. -->
          <section class="card panel-next" id="panelNext">
            <div class="panel-head">
              <h2 data-t="nextTitle"></h2>
              <span class="spacer"></span>
              <button type="button" id="nextGo" class="link small" data-t="nextGo"></button>
            </div>
            <div class="next-box" id="nextBox"></div>
            <p class="note" id="nextEmpty" data-t="nextEmpty" hidden></p>
            <!-- Qui e non fra i documenti. Un appuntamento è una cosa che succederà, e si prende
                 guardando i giorni: metterlo accanto a «aggiungi una pagina» lo faceva sembrare un
                 verbale da scrivere, che è quello che diventa **dopo**. -->
            <button type="button" id="newMeeting" class="accent wide" data-t="meetNew"></button>
          </section>

          <section class="card panel-decisions" id="panelDecisions">
            <div class="panel-head">
              <h2 data-t="decisionsTitle"></h2>
            </div>
            <ul class="list decision-list" id="decisionList"></ul>
            <p class="note" id="decisionsEmpty" data-t="decisionsEmpty" hidden></p>
          </section>

          <section class="card panel-waiting" id="panelWaiting" hidden>
            <div class="panel-head">
              <h2 data-t="waitingTitle"></h2>
            </div>
            <ul class="list" id="waitingList"></ul>
          </section>

          <!-- Chi ci lavora, e in che veste. Si riempie anche da solo: assegnare un'attività a
               qualcuno lo mette qui, perché è vero — se Marco ha un'attività qui, Marco lavora qui —
               e un elenco che va tenuto allineato a mano è un elenco che smette di essere vero. -->
          <section class="card panel-people" id="panelPeople">
            <div class="panel-head">
              <h2 data-t="peopleTitle"></h2>
              <span class="spacer"></span>
              <button type="button" id="peopleAll" class="link small" data-t="peopleAll"></button>
            </div>
            <p class="note" id="peopleNone" data-t="peopleNone" hidden></p>
            <ul class="list" id="peopleList"></ul>
            <form class="row quick-add" id="addPersonForm">
              <input type="text" id="addPersonName" list="rubricaList" maxlength="120" autocomplete="off"
                     data-t-placeholder="peopleAdd" data-t-label="peopleAdd">
              <datalist id="rubricaList"></datalist>
              <button type="submit" class="primary" data-t="peopleAddDo"></button>
            </form>
            <!-- L'elenco della rubrica è agganciato al campo da sempre, e non lo scopriva nessuno:
                 un `datalist` compare solo mentre si scrive, quindi chi non sa che c'è va a cercare
                 i nomi in rubrica e torna indietro a memoria. Detto qui, e solo quando c'è davvero
                 qualcuno da suggerire. -->
            <p class="note" id="peopleHint" data-t="peopleHint" hidden></p>
          </section>

          <section class="card panel-docs" id="panelDocs">
            <div class="panel-head">
              <h2 data-t="docsTitle"></h2>
              <span class="meta" id="docsCount"></span>
              <span class="spacer"></span>
              <button type="button" id="openPages" class="link small" data-t="panelPages"></button>
            </div>
            <div class="fav-chips" id="favChips" hidden></div>
            <ul class="list" id="pageList"></ul>
            <p class="note" id="pagesEmpty" data-t="pagesEmpty" hidden></p>
            <form class="row quick-add" id="newPageForm">
              <input type="text" id="pageField" maxlength="120" autocomplete="off">
              <button type="submit" id="addPage" class="primary" data-t="addPage"></button>
            </form>
          </section>

          <section class="card panel-changes" id="panelChanges" hidden>
            <div class="panel-head">
              <h2 data-t="changesTitle"></h2>
            </div>
            <ul class="list" id="changeList"></ul>
          </section>

          <!-- What the shared folder brought in, and when: the strip says it once and goes; whoever
               comes back after lunch reads it here. Only on a shared project, only once there is
               something to read. -->
          <section class="card panel-log" id="panelLog" hidden>
            <div class="panel-head">
              <h2 data-t="logTitle"></h2>
            </div>
            <ul class="list" id="logList"></ul>
          </section>
        </aside>
      </div>

      <p class="note invite" id="exportInvite" data-t="exportInvite" hidden></p>

      <!-- Fitts, applied: what gets used every day is a full-width button at the top of the panel,
           and what cannot be taken back easily sits down here, small and last. -->
      <!-- Per project, and only once a folder is linked: not every project is the team's. The
           switch and, under it, what it means right now — where the project is written, when it
           was last, and that it happens by itself. A switch among the buttons of the foot said
           none of that, and the first person to tick it asked how to save. -->
      <p class="note folder-line" id="sharedLine" hidden>
        <label class="check-line">
          <input type="checkbox" id="sharedToggle">
          <span data-t="sharedToggle"></span>
        </label>
        <span id="sharedText"></span>
        <button type="button" id="sharedFix" class="link small" data-t="sharedFix" hidden></button>
      </p>

      <div class="screen-foot">
        <button type="button" id="exportData" data-t="exportData"></button>
        <button type="button" id="renameProject" data-t="renameProject"></button>
        <span class="spacer"></span>
        <span class="meta" id="exportedWhen"></span>
        <!-- A project started from a template is full of somebody else's pages and tasks: this
             puts them all in the bin at once, with one undo, and leaves the project. -->
        <button type="button" id="emptyProject" class="ghost small" data-t="emptyProject"></button>
        <!-- Finished is not wrong: archiving takes it off the cards and keeps everything. -->
        <button type="button" id="archiveProject" class="ghost small"></button>
        <button type="button" id="trashProject" class="ghost small" data-t="trashProject"></button>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------------ the plan -->

  <!-- Two views of the same tasks, and they are views and not copies: moving a deadline on the
       calendar shows up on the board without a reload, because both read the same model. -->
  <section class="screen" id="plan" hidden>
    <div class="pagebar">
      <span class="spacer"></span>
      <span class="meta" id="planDue"></span>
      <!-- La porta che mancava: chi lavora sulla bacheca prende un appuntamento da qui, senza
           passare dalla pagina del progetto o dalla scheda di una persona. -->
      <button type="button" id="planMeeting" class="ghost small" data-t="newMeeting"></button>
      <!-- Quanto si vede della linea del tempo. All'apertura il progetto ci sta tutto — che è la
           sola veduta che dice la forma di un piano — e da qui si scende nel dettaglio. -->
      <span class="zoom" id="planZoom" hidden>
        <button type="button" id="zoomOut" class="ghost small icon" data-t-label="zoomOut">−</button>
        <button type="button" id="zoomIn" class="ghost small icon" data-t-label="zoomIn">+</button>
      </span>
      <button type="button" id="filtersOpen" class="ghost small" data-t="filtersOpen"></button>
      <!-- What leaves the plan: a calendar file, a spreadsheet, a page for somebody without the
           app, paper. And what comes in: a pasted list. Behind one button, like the page's. -->
      <div class="more">
        <button type="button" id="planMore" class="ghost small" aria-haspopup="true" aria-expanded="false" data-t-label="planMoreLabel">⋯</button>
        <div class="more-menu" id="planMoreMenu" hidden>
          <button type="button" id="planPaste" data-t="pasteOpen"></button>
          <button type="button" id="planCopy" data-t="copyForAssistant"></button>
          <button type="button" id="planIcs" data-t="exportIcs"></button>
          <button type="button" id="planCsv" data-t="exportCsv"></button>
          <button type="button" id="planHtml" data-t="exportHtml"></button>
          <button type="button" id="planPrint" data-t="printPage"></button>
        </div>
      </div>
    </div>

    <h1 class="print-title" id="printTitlePlan"></h1>

    <div class="filters" id="filters" hidden>
      <div class="filter-row" id="tagFilters"></div>
      <div class="filter-row" id="assigneeFilters"></div>
      <button type="button" id="filtersClear" class="ghost small" data-t="filtersClear"></button>
    </div>

    <div class="board" id="board"></div>
    <!-- How to pick several cards. The selection bar below existed, and nothing said how to reach
         it: Shift-click is not a gesture anybody tries on their own. Hidden on touch screens,
         where there is no Shift to hold. -->
    <p class="note board-hint" id="boardHint" data-t="selectHint" hidden></p>
    <!-- The selection bar: Shift-click picks cards, and this says what can be done to all of them
         at once. It is at the bottom, where the hand goes after it has finished picking. -->
    <div class="select-bar" id="selectBar" hidden>
      <span id="selectCount"></span>
      <select id="selectMove" data-t-label="selectMove"></select>
      <input type="text" id="selectAssign" maxlength="80" autocomplete="off" list="assigneeList" data-t-label="selectAssign">
      <input type="text" id="selectTag" maxlength="40" autocomplete="off" data-t-label="selectTag">
      <button type="button" id="selectTrash" class="ghost small danger" data-t="selectTrash"></button>
      <span class="spacer"></span>
      <button type="button" id="selectClear" class="ghost small" data-t="selectClear"></button>
    </div>

    <div class="calendar" id="calendar" hidden>
      <div class="cal-head">
        <button type="button" id="calPrev" class="ghost small">‹</button>
        <span id="calMonth"></span>
        <button type="button" id="calNext" class="ghost small">›</button>
        <button type="button" id="calToday" class="ghost small" data-t="calToday"></button>
      </div>
      <div class="cal-week" id="calWeekdays"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <!-- A month with nothing in it says so: an empty grid reads as one that has not loaded. Outside
         the calendar, as on the agenda: inside, the grid's rules drew it as a seventh row. -->
    <p class="empty cal-empty" id="calEmpty" data-t="calEmpty" hidden></p>

    <!-- The third view. The rows follow the board's columns on purpose: grouped by date it would
         be a second way of reading the same plan, and somebody who knows where a task sits on the
         board would have to find it again here. -->
    <div class="timeline" id="timeline" hidden></div>
  </section>

  <!-- ------------------------------------------------------------------ one page -->

  <!-- The plain text area is scaffolding with a future: in the next version it becomes the "source
       view" behind the block editor, which is why the page is stored as Markdown from today. -->
  <section class="screen" id="page" hidden>
    <div class="pagebar">
      <input type="text" id="pageTitleField" maxlength="120" autocomplete="off" data-t-label="pageTitlePlaceholder" data-t-placeholder="pageTitlePlaceholder" data-t-title="pageTitleHint">
      <span class="spacer"></span>
      <!-- How long the page is, and how long it takes to read: quiet, beside the save state. -->
      <span class="meta" id="pageWords" hidden></span>
      <span class="meta" id="saveState"></span>
      <button type="button" id="addImage" data-t="addImage"></button>
      <button type="button" id="addFile" class="ghost small" data-t="addFile"></button>
      <!-- Un documento scritto altrove, dentro la pagina: chi arriva con il lavoro già fatto ce
           l'ha in Word, e ribatterlo non è un'opzione. -->
      <button type="button" id="pageImport" class="ghost small" data-t="importFile"></button>
      <!-- Everything else about a page goes behind one button. «Vedi il sorgente» and «Esporta
           come Markdown» are for the few; leaving them in the bar put two pieces of jargon in
           front of everybody, every time. Progressive disclosure, as the plan calls it. -->
      <div class="more">
        <button type="button" id="pageMore" class="ghost small" aria-haspopup="true" aria-expanded="false" data-t-label="pageMoreLabel">⋯</button>
        <div class="more-menu" id="pageMoreMenu" hidden>
          <!-- The page's own shape first — its name, a chapter under it, a page beside it — then
               what can be done with its text. Pages were only ever made from the dashboard and
               from a [[link]]; nobody found either from here. -->
          <button type="button" id="renamePage" data-t="renamePage"></button>
          <button type="button" id="newSubpage" data-t="newSubpage"></button>
          <button type="button" id="newSibling" data-t="newSibling"></button>
          <button type="button" id="movePageUnder" data-t="movePageUnder"></button>
          <button type="button" id="movePageUp" data-t="movePageUp"></button>
          <button type="button" id="movePageDown" data-t="movePageDown"></button>
          <hr>
          <button type="button" id="starPage"></button>
          <button type="button" id="boxesToPlan" data-t="boxesToPlan"></button>
          <!-- La riga che spiega come si scrive: si spegne e si riaccende da qui, perché dopo un
               po' è rumore su ogni pagina e per qualcun altro è ancora la cosa che serve. -->
          <button type="button" id="editorNoteToggle"></button>
          <button type="button" id="copyPage" data-t="copyForAssistant"></button>
          <button type="button" id="printPage" data-t="printPage"></button>
          <button type="button" id="exportHtml" data-t="exportHtml"></button>
          <button type="button" id="openVersions" data-t="versionsOpen"></button>
          <button type="button" id="sourceToggle"></button>
          <button type="button" id="exportPage" data-t="exportPage"></button>
          <button type="button" id="trashPage" class="danger" data-t="removePage"></button>
        </div>
      </div>
    </div>
    <p class="note" id="editorNote" data-t="editorNote"></p>
    <!-- Printed only: the title lives in the bar, which paper does not get. -->
    <h1 class="print-title" id="printTitlePage"></h1>
    <!-- Two views of one document. The blocks are what you write in; the source is the Markdown
         underneath, for the few who want it — and the reason the file on disk is Markdown in the
         first place is that this view can exist at all. -->
    <div class="page-main">
      <!-- The other pages of the project, one column to the left: favourites, the ones opened
           last, then the tree. A page that can only be reached by going back to the dashboard is a
           page two clicks away from the one being written, and a knowledge base is made of pages
           that point at each other. Hidden on a narrow screen, where the column would be the text's. -->
      <div class="page-tree" id="pageTreeWrap">
        <!-- The headings of the page on screen, over the tree: a long page read by its sections. -->
        <nav class="page-outline" id="pageOutline" data-t-label="outlineTitle" hidden>
          <h3 data-t="outlineTitle"></h3>
          <div id="pageOutlineList"></div>
        </nav>
        <nav id="pageTree" data-t-label="treeLabel"></nav>
        <!-- Under the tree, always: the two things somebody looking at a tree wants to do to it. -->
        <div class="tree-foot">
          <button type="button" id="treeAddPage" class="ghost small" data-t="treeAddPage"></button>
          <button type="button" id="treeAddSubpage" class="ghost small" data-t="treeAddSubpage"></button>
          <button type="button" id="treeFromTemplate" class="ghost small" data-t="treeFromTemplate"></button>
        </div>
      </div>
      <div class="page-column">
        <!-- The page's properties, above the text and in its column: one line, the tags. Where a
             document keeps what is about it rather than in it. -->
        <div class="page-props">
          <!-- Un riquadro solo attorno a tutta la testa del file: i tag e le proprietà sono quello
               che sta *sopra* i tre trattini, e il testo della pagina è quello che sta sotto. Erano
               due cose sciolte sopra il corpo, e chi arrivava da un'altra pagina non sapeva dove
               finiva l'una e cominciava l'altro. -->
          <!-- Cosa è questa pagina, quando è un incontro: «Appuntamento · giovedì 17 alle 15:00 ·
               fra 2 giorni» finché il momento è davanti, «Incontro del 10 settembre · con Marco»
               dopo. Cambia da solo quando l'orologio la supera. Senza questa riga un appuntamento
               e il suo verbale erano la stessa pagina con la stessa faccia. -->
          <!-- Di chi è questa pagina, quando è il documento di un'attività: il nome dell'attività,
               e il clic riapre la sua scheda. Il filo si percorre nei due versi o non è un filo. -->
          <p class="kicker page-kind page-task" id="pageTask" hidden></p>
          <p class="kicker page-kind" id="pageKind" hidden></p>
          <div class="page-head">
            <input type="text" id="pageTags" class="tags-field" maxlength="200" autocomplete="off" data-t-label="pageTagsLabel">
            <!-- On a meeting: the place, as a link, and «Edit the details», which opens the rows as
                 the file writes them. Closed, the raw head of the file stays out of sight. -->
            <p class="page-facts" id="pageFacts" hidden></p>
            <!-- The properties: key and value, one line each, kept at the head of the Markdown as
                 the block Obsidian reads. «+» adds a line; a line emptied goes away on its own. -->
            <div class="props" id="pageProps"></div>
            <button type="button" id="propAdd" class="ghost small prop-add" data-t="propAdd"></button>
            <datalist id="propKeys"></datalist>
          </div>
        </div>
        <div class="editor" id="editor"></div>
        <textarea id="pageBody" spellcheck="true" data-t-label="sourceView" hidden></textarea>
      </div>
    </div>
    <input type="file" id="imageFile" accept="image/*" hidden>
    <input type="file" id="attachFile" hidden>
    <input type="file" id="importDocFile" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
  </section>

  <!-- ------------------------------------------------------------------ the bin -->

  <!-- ------------------------------------------------------------------ the pages, as a table -->

  <!-- Every page of the project as a row, with its tags and its properties as columns: the view
       that turns thirty pages into something that can be sorted and filtered, without inventing a
       format — the columns are whatever keys the pages carry. -->
  <section class="screen" id="pages" hidden>
    <div class="pagebar">
      <span class="spacer"></span>
      <span class="meta" id="pagesCount"></span>
    </div>
    <div class="filters" id="pagesFilters"></div>
    <div class="table-wrap">
      <table class="pages-table" id="pagesTable"></table>
      <p class="note" id="pagesTableEmpty" data-t="pagesTableEmpty" hidden></p>
    </div>
  </section>

  <!-- La rubrica: le persone, che sono la prima cosa di quest'app a non appartenere a un progetto.
       Sta accanto a «Progetti» e non dentro, perché è lì che vivono: la stessa persona torna su
       lavori diversi, ed è esattamente quello che una rubrica è. -->
  <!-- ------------------------------------------------------------------ the whole month -->

  <!-- Il calendario di tutto: un mese, e dentro gli appuntamenti e le scadenze di ogni progetto.
       Il calendario del progetto resta dov'è e risponde a un'altra domanda; questo risponde a
       «cosa c'è giovedì», che prima si poteva chiedere solo a un progetto per volta. -->
  <section class="screen" id="agendaScreen" hidden>
    <div class="wrap">
      <div class="screen-head">
        <h1 data-t="agendaTitle"></h1>
        <span class="spacer"></span>
        <button type="button" id="agMeeting" class="primary" data-t="newMeeting"></button>
      </div>
      <p class="note" data-t="agendaHint"></p>
      <div class="calendar">
        <div class="cal-head">
          <button type="button" id="agPrev" class="ghost small">‹</button>
          <span id="agMonth"></span>
          <button type="button" id="agNext" class="ghost small">›</button>
          <button type="button" id="agToday" class="ghost small" data-t="calToday"></button>
        </div>
        <div class="cal-week" id="agWeekdays"></div>
        <div class="cal-grid" id="agGrid"></div>
      </div>
      <p class="empty" id="agEmpty" data-t="agendaEmpty" hidden></p>
    </div>
  </section>

  <section class="screen" id="rubrica" hidden>
    <div class="wrap">
      <div class="screen-head">
        <h1 data-t="rubricaTitle"></h1>
        <span class="spacer"></span>
        <!-- Due formati perché servono a due cose: il foglio si guarda, la vCard si importa in una
             rubrica vera. Restano accanto al comando principale e non dietro un menu: sono due, e
             un menu per due voci è un clic in più per nascondere niente. -->
        <button type="button" id="contactsCsv" class="ghost small" data-t="contactsCsv"></button>
        <button type="button" id="contactsVcf" class="ghost small" data-t="contactsVcf"></button>
        <button type="button" id="newPerson" class="primary" data-t="newPerson"></button>
      </div>
      <p class="note" data-t="rubricaHint"></p>
      <input type="search" id="personSearch" autocomplete="off" data-t-placeholder="rubricaSearch" data-t-label="rubricaSearch">
      <p class="empty" id="rubricaEmpty" data-t="rubricaEmpty" hidden></p>
      <ul class="list" id="personList"></ul>
    </div>
  </section>

  <!-- La scheda di una persona, ed è il pezzo che ripaga la rubrica centrale: chi è, dove lavora,
       cosa ci siamo detti, e come eravamo rimasti — le ultime due attraverso *tutti* i progetti,
       che è la domanda a cui le sole pagine dentro un progetto non potevano rispondere. -->
  <section class="screen" id="person" hidden>
    <div class="wrap">
      <div class="screen-head">
        <h1 id="personTitle"></h1>
        <span class="spacer"></span>
        <!-- Due verbi: prendere un appuntamento (chiede quando) e segnare una conversazione avuta
             (nasce oggi, senza ora, quindi è già un verbale e non suona mai). Un pulsante solo
             faceva passare ogni nota per un impegno. -->
        <button type="button" id="personNote" data-t="newNote"></button>
        <button type="button" id="personMeeting" class="ghost small" data-t="newMeeting"></button>
        <button type="button" id="personTrash" class="ghost small danger" data-t="personTrash"></button>
      </div>

      <p class="note" id="personLast" hidden></p>
      <div class="card" id="personCard">
        <label for="personName" data-t="personName"></label>
        <input type="text" id="personName" maxlength="120" autocomplete="off">
        <label for="personCompany" data-t="personCompany"></label>
        <input type="text" id="personCompany" maxlength="120" autocomplete="off">
        <label for="personRole" data-t="personRole"></label>
        <input type="text" id="personRole" maxlength="80" autocomplete="off">
        <label for="personEmail" data-t="personEmail"></label>
        <input type="email" id="personEmail" maxlength="160" autocomplete="off">
        <label for="personPhone" data-t="personPhone"></label>
        <input type="text" id="personPhone" maxlength="60" autocomplete="off">
        <!-- I recapiti si usano, non solo si leggono: da qui partono il messaggio e la chiamata,
             che su un telefono erano un copia e incolla. Compaiono quando c'è qualcosa da usare. -->
        <p class="row person-reach" id="personReach" hidden></p>
        <!-- What is worth knowing about the person and belongs to no project: before this field it
             went into a project page, and was found only by whoever opened that project. -->
        <label for="personNotes" data-t="personNotes"></label>
        <textarea id="personNotes" rows="3" maxlength="4000" data-t-placeholder="personNotesHint"></textarea>
        <!-- Detto qui, dove si scrivono, e non in una Guida che nessuno apre prima di scrivere. -->
        <p class="note" data-t="personPrivacy"></p>
      </div>

      <div class="card">
        <h2 data-t="personProjectsTitle"></h2>
        <p class="note" id="personProjectsNone" data-t="personProjectsNone" hidden></p>
        <ul class="list" id="personProjects"></ul>
        <!-- Il collegamento fra una persona e un progetto è una relazione a due capi, e finché si
             poteva toccare da un capo solo — il pannello del progetto — questa scheda era un
             vicolo cieco: diceva dove lavora e non lasciava aggiungere un posto. -->
        <form class="row" id="addWhereForm">
          <select id="addWhereProject" data-t-label="personAddWhere"></select>
          <button type="submit" class="ghost small" data-t="peopleAddDo"></button>
        </form>
        <p class="note" id="addWhereNone" data-t="personAddWhereNone" hidden></p>
      </div>

      <!-- Quello che deve ancora succedere, sopra quello che è successo. Stavano nello stesso
           elenco, e l'appuntamento di giovedì si confondeva fra i verbali dell'anno scorso: la
           prima cosa che si cerca su una persona era la più difficile da trovare. -->
      <div class="card" id="personAheadCard" hidden>
        <h2 data-t="personAheadTitle"></h2>
        <ul class="list" id="personAhead"></ul>
      </div>

      <div class="card">
        <h2 data-t="personMeetingsTitle"></h2>
        <p class="note" id="personMeetingsNone" data-t="personMeetingsNone" hidden></p>
        <ul class="list" id="personMeetings"></ul>
      </div>

      <div class="card">
        <h2 data-t="personTasksTitle"></h2>
        <p class="note" id="personTasksNone" data-t="personTasksNone" hidden></p>
        <ul class="list" id="personTasks"></ul>
      </div>
    </div>
  </section>

  <!-- Dove stanno i dati: la cartella che tiene la copia di tutto, e le cartelle in cui i progetti
       sono condivisi. Erano due dialoghi, ed erano la cosa sbagliata per quello che contengono —
       un elenco di trenta copie e un elenco di cartelle con i loro permessi non sono una domanda a
       cui si risponde e si chiude, sono uno stato che si guarda. Una schermata glielo lascia fare.
       Si chiama «Cartelle e copie» e non «Archivio» perché in quest'app l'archivio è già la
       schermata dei progetti, e due cose con lo stesso nome sono una cosa che nessuno trova. -->
  <section class="screen" id="folderScreen" hidden>
    <div class="wrap">
      <div class="screen-head">
        <h1 data-t="placesTitle"></h1>
      </div>

      <!-- Il nome sta in testa e fuori dalle due carte perché è di questa copia dell'app, non di
           una delle due cartelle: è la firma con cui esce tutto quello che esce da qui. Stava in
           fondo alla seconda carta, dove lo trovava solo chi era già arrivato a condividere. -->
      <div class="card" id="whoCard">
        <label for="folderWho" data-t="folderWho"></label>
        <input type="text" id="folderWho" maxlength="60" autocomplete="off">
        <p class="note" data-t="folderNote"></p>
      </div>

      <div class="card">
        <h2 data-t="backupTitle"></h2>
        <p data-t="backupHint"></p>
        <p class="note" data-t="backupNote"></p>
        <p class="note" id="backupStatus" aria-live="polite"></p>
        <div class="row">
          <button type="button" id="backupPick" class="primary" data-t="backupPick"></button>
          <button type="button" id="backupUnlink" class="ghost small danger" data-t="backupUnlink" hidden></button>
        </div>
        <h3 data-t="backupCopies"></h3>
        <p class="note" id="backupCopiesNone" data-t="backupCopiesNone" hidden></p>
        <ul class="list" id="backupCopyList"></ul>
      </div>

      <div class="card">
        <h2 data-t="folderTitle"></h2>
        <p data-t="folderHint"></p>
        <div class="row">
          <button type="button" id="folderAdd" class="primary" data-t="folderAdd"></button>
          <button type="button" id="folderOpen" data-t="folderOpen"></button>
        </div>
        <h3 data-t="folderList"></h3>
        <p class="note" id="folderEmpty" data-t="folderEmpty" hidden></p>
        <!-- Detto una volta e non su ogni riga: perché quei progetti sono elencati e non sono qui. -->
        <p class="note" id="folderNew" data-t="folderNewNote" hidden></p>
        <ul class="list" id="folderItems"></ul>
      </div>
    </div>
  </section>

  <section class="screen" id="trash" hidden>
    <div class="wrap">
      <div class="screen-head">
        <h1 data-t="trashTitle"></h1>
        <button type="button" id="trashPurge" class="danger" data-t="trashPurge" hidden></button>
        <button type="button" id="trashBack" data-t="trashBack"></button>
      </div>
      <p class="note" data-t="trashNote"></p>
      <ul class="list" id="trashList"></ul>
      <p class="empty" id="trashEmpty" data-t="trashEmpty" hidden></p>
    </div>
  </section>

  <!-- The first time, once: what this is, that the fair is an example, where the writing stays.
       Not a tour — a tour is clicked away — but a door with two handles. -->
  <dialog id="welcomeDialog">
    <h2 data-t="welcomeTitle"></h2>
    <p data-t="welcomeText"></p>
    <p class="note" data-t="welcomeNote"></p>
    <div class="row">
      <button type="button" id="welcomeExample" class="primary" data-t="welcomeExample"></button>
      <button type="button" id="welcomeOwn" data-t="welcomeOwn"></button>
      <span class="spacer"></span>
      <button type="button" id="welcomeGuide" class="ghost small" data-t="welcomeGuide"></button>
    </div>
  </dialog>

  <!-- The app's own question, for what used to be the browser's `prompt`: a name, a choice, a yes
       or no. One dialog, three shapes; `ui.ask` fills it and reads it. -->
  <dialog id="askDialog" class="ask">
    <form id="askForm">
      <p id="askText" tabindex="-1"></p>
      <input type="text" id="askField" maxlength="200" autocomplete="off" data-t-label="askField" hidden>
      <select id="askSelect" data-t-label="askSelect" hidden></select>
      <div class="row">
        <button type="submit" id="askOk" class="primary"></button>
        <span class="spacer"></span>
        <button type="button" id="askCancel"></button>
      </div>
    </form>
  </dialog>

  <!-- Removing a shared folder removes it from everybody's Dropbox: it asks. -->
  <dialog id="dropDialog">
    <h2 data-t="dropTitle"></h2>
    <p id="dropText"></p>
    <div class="row">
      <button type="button" id="dropConfirm" class="danger" data-t="dropConfirm"></button>
      <span class="spacer"></span>
      <button type="button" id="dropClose" data-t="menuClose"></button>
    </div>
  </dialog>

  <!-- Emptying the bin is the one thing in the app that cannot be undone: it asks. -->
  <dialog id="purgeDialog">
    <h2 data-t="purgeTitle"></h2>
    <p id="purgeText"></p>
    <div class="row">
      <button type="button" id="purgeConfirm" class="danger" data-t="purgeConfirm"></button>
      <span class="spacer"></span>
      <button type="button" id="purgeClose" data-t="menuClose"></button>
    </div>
  </dialog>

  <!-- ------------------------------------------------------------------ the achievements -->

  <!-- A page you have to go and look at. They are shown here and nowhere else: an achievement that
       arrives as a notification is an interruption wearing a rosette. -->
  <section class="screen" id="awards" hidden>
    <div class="wrap">
      <div class="screen-head">
        <h1 data-t="awardsTitle"></h1>
        <button type="button" id="awardsBack" data-t="trashBack"></button>
      </div>
      <p class="note" data-t="awardsNote"></p>
      <ul class="list" id="awardsList"></ul>
    </div>
  </section>

  <!-- ------------------------------------------------------------------ error -->

  <section class="error" id="error" hidden>
    <h2 id="errorTitle"></h2>
    <p id="errorText"></p>
    <button type="button" id="retry"></button>
  </section>

</main>

<!-- Not a dialog and not a question: a strip that states what happened and offers to take it back.
     There is no "are you sure?" anywhere in this app, and this is what replaces it. -->
<div class="snack" id="snack" role="status" aria-live="polite" hidden>
  <span id="snackText"></span>
  <button type="button" id="snackAction"></button>
</div>

<dialog id="importDialog">
  <h2 data-t="importTitle"></h2>
  <p id="importSummary"></p>
  <div class="row">
    <!-- «Aggiorna» comes first when the file is a copy of a project that is already here — the
         same lineage, told by `uid` — because that is what somebody who receives a colleague's
         file wants nine times out of ten. Importing it as a second project is still there. -->
    <button type="button" id="importUpdate" class="primary" hidden></button>
    <button type="button" id="importNew" data-t="importNew"></button>
    <!-- Two buttons that are never both on screen: one adds a project, the other puts a whole
         backup back and replaces what is here. They are told apart by what is inside the file, and
         they are separate buttons because replacing everything is not a thing to offer by accident. -->
    <button type="button" id="importReplace" hidden></button>
    <button type="button" id="importRestore" class="primary" hidden></button>
    <button type="button" id="importCancel" data-t="importCancel"></button>
  </div>
</dialog>

<!-- The card of one task. Six fields are visible; the rest — priority, tags, checklist, what it
     waits for — sit behind «Mostra altro», because a form with fourteen boxes is how a tool for
     planning becomes a thing people avoid opening. -->
<dialog id="taskCard">
  <h2 data-t="cardTitle"></h2>

  <label for="cardTitleField" id="cardTitleLabel"></label>
  <input type="text" id="cardTitleField" maxlength="160" autocomplete="off">

  <label for="cardNotes" id="cardNotesLabel"></label>
  <textarea id="cardNotes" rows="3"></textarea>

  <!-- Il documento dell'attività, subito sotto le note perché è quello che le note non sono: un
       campo di testo basta per «chiamare il fornitore», non per una procedura con gli allegati, le
       immagini e le sottopagine che servono a chi la esegue. Quella è una pagina del progetto, e
       qui c'è il filo che la lega a questa attività. -->
  <span class="field-label" id="cardDocLabel" data-t="cardDoc"></span>
  <div class="row card-doc">
    <button type="button" id="cardDocOpen" class="accent" hidden></button>
    <button type="button" id="cardDocMake" class="accent" data-t="cardDocMake"></button>
    <button type="button" id="cardDocOff" class="ghost small" data-t="cardDocOff" hidden></button>
  </div>
  <p class="note" id="cardDocHint" data-t="cardDocHint"></p>

  <div class="card-dates">
    <div>
      <label for="cardStart" id="cardStartLabel"></label>
      <input type="date" id="cardStart">
    </div>
    <div>
      <label for="cardEnd" id="cardEndLabel"></label>
      <input type="date" id="cardEnd">
    </div>
  </div>

  <!-- Le etichette e chi ci lavora stanno qui, in chiaro e non dietro «Mostra altro»: sono le due
       cose che la bacheca già mostra sulla carta, e nasconderle nella maschera che le riempie
       voleva dire far cercare il modo di scrivere una cosa che si vede da fuori. -->
  <label for="cardTags" id="cardTagsLabel"></label>
  <input type="text" id="cardTags" maxlength="200" autocomplete="off" list="cardTagList">
  <datalist id="cardTagList"></datalist>

  <label for="cardAssignee" id="cardAssigneeLabel"></label>
  <input type="text" id="cardAssignee" maxlength="80" autocomplete="off" list="assigneeList">
  <datalist id="assigneeList"></datalist>

  <label for="cardPriority" id="cardPriorityLabel"></label>
  <select id="cardPriority"></select>

  <!-- «È un traguardo» da solo non dice cosa succede a spuntarlo, e una casella che non dice cosa
       fa non la spunta nessuno. La riga sotto lo dice: le tre cose che cambiano, e nessun'altra. -->
  <label class="check-line">
    <input type="checkbox" id="cardMilestone">
    <span id="cardMilestoneLabel"></span>
  </label>
  <p class="note check-note" id="cardMilestoneHint"></p>

  <!-- A sub-task's card says whose it is, and takes you back there. -->
  <p class="note card-parent" id="cardParent" hidden>
    <span id="cardParentText"></span>
    <button type="button" id="cardParentOpen" class="ghost small" data-t="cardParentOpen"></button>
  </p>

  <!-- Le due liste, vicine e con scritta la differenza. Prima una era qui e l'altra dietro «Mostra
       altro», e due cose che si somigliano tanto, separate così, si sceglievano a caso. -->
  <span class="field-label" id="cardSubtasksLabel" data-t="cardSubtasks"></span>
  <p class="note" id="cardListsHint" data-t="cardListsHint"></p>
  <ul class="list" id="cardSubtasks"></ul>
  <form class="row" id="cardSubtaskForm">
    <input type="text" id="cardSubtaskField" maxlength="160" autocomplete="off"
           data-t-label="subtaskPlaceholder" data-t-placeholder="subtaskPlaceholder">
    <button type="submit" id="cardSubtaskAdd" data-t="subtaskAdd"></button>
  </form>

  <span class="field-label" id="cardChecklistLabel"></span>
  <ul class="list" id="cardChecklist"></ul>
  <form class="row" id="cardChecklistForm">
    <input type="text" id="cardChecklistField" maxlength="160" autocomplete="off">
    <button type="submit" id="cardChecklistAdd"></button>
  </form>

  <!-- Into a calendar, as a copy: a file every calendar opens, and a link that opens Google
       Calendar already filled in. Shown only when there is a date to put there. -->
  <div class="row card-calendar" id="cardCalendar" hidden>
    <button type="button" id="cardIcs" class="ghost small" data-t="cardIcs"></button>
    <a id="cardGoogle" class="button-link" href="#" target="_blank" rel="noopener" data-t="cardGoogle"></a>
    <span class="meta" data-t="calendarCopy"></span>
  </div>

  <button type="button" id="cardMore" class="ghost small"></button>

  <!-- Quello che resta dietro il pulsante sono le due cose che su dieci attività ne riguardano una:
       la ripetizione e il legame con un'altra. Sei campi nascosti erano un cassetto; due sono una
       riserva. -->
  <div id="cardExtra" hidden>
    <label for="cardRepeat" id="cardRepeatLabel"></label>
    <select id="cardRepeat"></select>
    <!-- «Si ripete» fa pensare a una serie, e una serie non c'è: di attività ne esiste una alla
         volta, e la prossima nasce quando spunti questa. Chi si aspetta di vedere le ricorrenze
         sul calendario va detto adesso, non quando non le trova. -->
    <p class="note check-note" id="cardRepeatHint"></p>

    <label for="cardBlocked" id="cardBlockedLabel"></label>
    <select id="cardBlocked"></select>
  </div>

  <div class="row card-foot">
    <button type="button" id="cardClose" class="primary" data-t="cardClose"></button>
    <span class="spacer"></span>
    <button type="button" id="cardDelete" class="ghost small" data-t="cardDelete"></button>
  </div>
</dialog>

<!-- The strip over a selection. It is the twin of Cmd+B and Cmd+I: the shortcuts are for people who
     already know them, and this is for everybody else. -->
<div class="mark-bar" id="markBar" hidden>
  <button type="button" id="markBold"><strong>B</strong></button>
  <button type="button" id="markItalic"><em>I</em></button>
  <button type="button" id="markStrike"><del>S</del></button>
  <button type="button" id="markCode"><code>&lt;&gt;</code></button>
  <button type="button" id="markLink">🔗</button>
  <button type="button" id="markPage">[[ ]]</button>
</div>

<!-- The `/` menu, and the same list behind the `+` beside every block: a shortcut that is the only
     way to reach something is a shortcut somebody has to be told about. -->
<dialog id="searchDialog" class="search">
  <h2 data-t="searchTitle"></h2>
  <input type="search" id="searchField" autocomplete="off" data-t-label="searchTitle">
  <div class="menu-list" id="searchList" role="listbox"></div>
  <p class="note" id="searchEmpty" data-t="searchEmpty" hidden></p>
  <div class="row menu-foot">
    <span class="meta" data-t="searchHint"></span>
    <span class="spacer"></span>
    <button type="button" id="searchClose" data-t="menuClose"></button>
  </div>
</dialog>

<!-- A pasted list becomes cards. It is the way back from «Copia per un assistente», and it is
     also how a list from Word, from a mail or from a colleague gets onto the board without
     retyping. One line, one card; `@2026-09-20` is the date, `#tag` a tag, `!` a high priority. -->
<!-- The texts a page had. One is chosen on the left; what it would change is on the right,
     paragraph by paragraph, before anything is done. «Ripristina» writes it back, with an undo. -->
<dialog id="versionsDialog" class="versions">
  <h2 data-t="versionsTitle"></h2>
  <p data-t="versionsHint"></p>
  <div class="versions-body">
    <ul class="list versions-list" id="versionsList"></ul>
    <div class="versions-diff" id="versionsDiff"></div>
  </div>
  <p class="note" id="versionsEmpty" data-t="versionsEmpty" hidden></p>
  <div class="row">
    <button type="button" id="versionRestore" class="primary" data-t="versionRestore" disabled></button>
    <span class="spacer"></span>
    <button type="button" id="versionsClose" data-t="menuClose"></button>
  </div>
</dialog>





<!-- A task from anywhere, without leaving the screen: Ctrl+N, a title, Enter. -->
<dialog id="quickDialog">
  <h2 data-t="quickTitle"></h2>
  <form id="quickForm">
    <input type="text" id="quickField" maxlength="160" autocomplete="off" data-t-label="quickTitle">
    <label for="quickProject" data-t="quickProject"></label>
    <select id="quickProject"></select>
    <div class="row">
      <button type="submit" id="quickAdd" class="primary" data-t="quickAdd"></button>
      <button type="button" id="quickCancel" data-t="cancelProject"></button>
    </div>
  </form>
</dialog>

<!-- The shortcuts, on «?». Drawn from the dictionary so that the two languages cannot drift. -->
<!-- I promemoria delle scadenze. Tre strati, e il dialogo li dice tutti e tre invece di
     promettere «notifiche» e lasciare che ognuno scopra da sé dove non arrivano. -->
<dialog id="remindDialog">
  <h2 data-t="remindTitle"></h2>
  <p class="note" data-t="remindLead"></p>
  <form id="remindForm">
    <label class="check-line">
      <input type="checkbox" id="remindOn">
      <span data-t="remindOn"></span>
    </label>
    <div class="row remind-when">
      <label for="remindDays" data-t="remindDays"></label>
      <input type="number" id="remindDays" min="0" max="30" step="1" inputmode="numeric">
      <label for="remindHour" data-t="remindHour"></label>
      <input type="number" id="remindHour" min="0" max="23" step="1" inputmode="numeric">
    </div>
    <!-- Un appuntamento si misura in minuti, non in giorni-alle-nove: a una riunione delle 15:00
         la sveglia serve alle 14:30, e «il giorno prima alle nove» avviserebbe quando non si può
         ancora fare niente e tacerebbe quando bisogna uscire. -->
    <div class="row remind-when">
      <label for="remindBefore" data-t="remindBefore"></label>
      <input type="number" id="remindBefore" min="0" max="1440" step="5" inputmode="numeric">
      <span class="meta" data-t="remindBeforeUnit"></span>
    </div>
    <p class="note" id="remindSays"></p>
    <!-- Il permesso si chiede da qui e da nessun altro posto: chiesto all'avvio, un «no» chiude
         la porta per sempre e dall'app non si riapre. -->
    <div class="row" id="remindAskRow" hidden>
      <button type="button" id="remindAsk" data-t="remindAsk"></button>
    </div>
    <p class="note" id="remindState"></p>
    <div class="row">
      <button type="submit" id="remindSave" class="primary" data-t="remindSave"></button>
      <button type="button" id="remindCancel" data-t="cancelProject"></button>
    </div>
  </form>
</dialog>

<dialog id="keysDialog">
  <h2 data-t="keysTitle"></h2>
  <div id="keysList"></div>
  <p class="note" data-t="keysMac"></p>
  <div class="row">
    <button type="button" id="keysClose" class="primary" data-t="menuClose"></button>
  </div>
</dialog>

<dialog id="pasteDialog">
  <h2 data-t="pasteTitle"></h2>
  <p data-t="pasteHint"></p>
  <textarea id="pasteField" rows="8" spellcheck="false" data-t-label="pasteTitle"></textarea>
  <p class="note" id="pasteCount"></p>
  <div class="row">
    <button type="button" id="pasteAdd" class="primary" data-t="pasteAdd"></button>
    <button type="button" id="pasteCancel" data-t="cancelProject"></button>
  </div>
</dialog>

<!-- «Quando?», che è la prima domanda di un appuntamento. Prima l'incontro nasceva al giorno in
     cui lo si apriva, perché il verso previsto era «ho appena finito una riunione»: per segnarne
     una futura si correggeva la data subito dopo, ogni volta. -->
<!-- La stessa maschera per prenderlo e per correggerlo: aperta da una scheda della lavagna porta
     i valori della pagina, e in fondo le due cose che si fanno a un appuntamento già preso —
     andare alle note, o toglierlo. Le etichette sopra le caselle e le caselle larghe quanto la
     riga: le regole della scheda attività sono sue e non arrivano qui, e senza le proprie il
     modulo si impaginava come testo corrente. -->
<dialog id="meetDialog" class="fields">
  <h2 id="meetTitle" data-t="meetTitle"></h2>
  <form id="meetForm">
    <div class="field">
      <label for="meetWhat" id="meetWhatLabel"></label>
      <input type="text" id="meetWhat" maxlength="120" autocomplete="off">
    </div>
    <div class="field-pair">
      <div class="field">
        <label for="meetDate" id="meetDateLabel"></label>
        <input type="date" id="meetDate" required>
      </div>
      <div class="field">
        <label for="meetTime" id="meetTimeLabel"></label>
        <input type="time" id="meetTime">
      </div>
    </div>
    <!-- La regola del momento, detta dove si decide: un incontro di oggi senza ora è già un verbale,
         quindi non entra in nessuna lista e non suona. Chi segna un appuntamento per oggi lo scopriva
         dopo, non vedendolo fra le scadenze. -->
    <p class="note" id="meetTodayHint" data-t="meetTodayHint" hidden></p>
    <div class="field">
      <label for="meetWith" id="meetWithLabel"></label>
      <input type="text" id="meetWith" maxlength="200" autocomplete="off" data-t-placeholder="meetWithMany">
      <!-- Chi lavora al progetto e la rubrica, da toccare: un nome entra, un altro tocco lo toglie.
           Una `datalist` completava il campo intero, e al secondo nome cancellava il primo. -->
      <div class="chips" id="meetWithPeople"></div>
    </div>
    <div class="field">
      <label for="meetWhere" id="meetWhereLabel"></label>
      <input type="text" id="meetWhere" maxlength="200" autocomplete="off"
             data-t-placeholder="meetWhereHint">
    </div>
    <!-- A meeting that comes back: the next one is written when this one's moment has passed. -->
    <div class="field">
      <label for="meetRepeat" id="meetRepeatLabel"></label>
      <select id="meetRepeat"></select>
    </div>
    <div class="row form-foot">
      <button type="submit" id="meetOk" class="primary" data-t="meetOk"></button>
      <button type="button" id="meetCancel" data-t="cancelProject"></button>
      <span class="spacer"></span>
      <button type="button" id="meetOpen" class="ghost small" data-t="meetOpen" hidden></button>
      <button type="button" id="meetTrash" class="ghost small" data-t="meetTrash" hidden></button>
    </div>
  </form>
</dialog>

<dialog id="blockMenu">
  <h2 id="blockMenuTitle"></h2>
  <input type="text" id="blockMenuField" autocomplete="off" data-t-label="menuFind">
  <div class="menu-list" id="blockMenuList"></div>
  <p class="note" id="blockMenuEmpty" data-t="menuEmpty" hidden></p>
  <!-- Only when the menu was opened from a block's handle: the two things that can be done to a
       block and had nowhere else to live. -->
  <div class="row menu-foot">
    <button type="button" id="blockDuplicate" data-t="blockDuplicate" hidden></button>
    <button type="button" id="blockDelete" class="ghost small" data-t="blockDelete" hidden></button>
    <span class="spacer"></span>
    <button type="button" id="blockMenuClose" data-t="menuClose"></button>
  </div>
</dialog>

<input type="file" id="importFile" accept=".zip,.json,application/zip,application/json" hidden>

<!-- Every import into the shared library goes through here, never up the tree. Both forms work
     identically today; the difference arrives the day _lib/ takes a version number, and it is one
     line per app instead of every import in every file. check_apps.py rejects the relative form. -->
<script type="importmap">
{ "imports": { "gg/": "../../_lib/" } }
</script>
<script type="module" src="./app.js"></script>
