<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPRONIA</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0d1220">
<meta name="description" content="A flying joust in the arcade tradition, played entirely in your browser.">
<link rel="canonical" href="https://ggtechnologies.sm/app/spronia/">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="../../_lib/base.css">
<link rel="stylesheet" href="./styles.css">
<script>
  // Before the first paint, on purpose. Applied from a module it would run after the stylesheet,
  // and the app would flash dark and then jump to light at every start.
  try {
    var saved = localStorage.getItem('gg-theme');
    var light = saved ? saved === 'light'
      : window.matchMedia('(prefers-color-scheme: light)').matches;
    if (light) {
      document.documentElement.setAttribute('data-theme', 'light');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f8fc');
    }
  } catch (ignored) {}

  // **L'invito a installare, preso al volo.**
  //
  // `beforeinstallprompt` è un evento che non aspetta: Chrome lo manda appena riconosce l'app come
  // installabile, e alla seconda visita — con il service worker già attivo e il manifesto già
  // letto — quel momento arriva **prima che un modulo abbia finito di caricarsi**. Il modulo si
  // registrava dopo, non lo vedeva mai, e il pulsante non compariva.
  //
  // Si vedeva solo su un telefono, ed è per questo che è rimasto in piedi: su un computer, dove le
  // app si aprono una volta e si guardano, l'evento arrivava tardi e il pulsante c'era.
  //
  // Qui è uno script inline in testa alla pagina: gira prima di qualunque modulo, mette l'evento da
  // parte, e `gg/install.js` lo ritrova quando è pronto.
  window.addEventListener('beforeinstallprompt', function (event) {
    event.preventDefault();
    window.__ggInstallPrompt = event;
  });
</script>
</head>
<body>

<header>
  <div class="appbar">
    <span class="brand">SPRONIA</span>
    <span class="meta" data-t="tagline"></span>
    <span class="spacer"></span>
    <!-- **L'invito a installare non sta qui**, sta nel pannello di fine partita.
         Nella barra chiedeva di installare un gioco a cui non avevi ancora giocato, e si prendeva
         sessanta pixel nella riga che su un telefono ne ha già pochi. A fine partita la domanda ha
         una risposta, ed è la prima volta che ce l'ha. -->
    <button type="button" id="lang" class="ghost small"></button>
    <!-- L'icona cambia con lo stato, non solo l'etichetta: l'onda quando suona, la croce quando no.
         Un pulsante che resta identico dopo che l'hai premuto non dice di aver fatto niente, e
         l'aria-label lo sa solo chi usa uno screen reader. -->
    <button type="button" id="sound" class="ghost small icon" data-t-label="soundOn" data-sound="on">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
        <path class="i-wave" d="M16.5 8.5a5 5 0 0 1 0 7"></path>
        <path class="i-mute" d="M17 10l4 4M21 10l-4 4"></path>
      </svg>
    </button>
    <!-- **A tutto schermo**, e sta accanto agli altri due invece che dentro il campo: è una
         preferenza dell'app come il suono e il tema, non un comando del gioco. Quello per uscire
         invece sta sopra il campo, perché a tutto schermo questa barra non c'è più. -->
    <button type="button" id="full" class="ghost small icon" data-t-label="fullOn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path>
      </svg>
    </button>
    <button type="button" id="theme" class="ghost small icon" data-t-label="themeToLight">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"></path>
      </svg>
    </button>
  </div>

  <!-- La seconda altezza, e volutamente magra: punti, vite e ondata stanno **dentro** il campo,
       disegnati in cifre e teste di cavaliere. Qui resta quello che il campo non può dire senza
       diventare bilingue — i crediti e un pulsante di pausa, che su un telefono è l'unico modo di
       fermare una partita. -->
  <div class="hudbar" id="hud" hidden>
    <span class="hud-item"><span class="hud-label" data-t="credits"></span><b id="creditsSmall">0</b></span>
    <span class="spacer"></span>
    <button type="button" id="pauseButton" class="ghost small" data-t="pause"></button>
  </div>

</header>

<main id="main">

  <!-- Il campo. Tutto il resto della pagina sta sopra, ed è per questo che il canvas non viene mai
       nascosto: un cabinato non diventava nero nemmeno lui, e un rettangolo vuoto dietro un pannello
       si legge come un guasto. -->
  <div class="stage">
    <canvas id="field" aria-hidden="true"></canvas>

    <!-- L'uscita dal tutto schermo. Un solo comando sopra il campo, in un angolo, e non di più:
         tutto quello che si appoggia lì copre la cosa che si era voluto ingrandire. -->
    <button type="button" id="fullExit" class="full-exit" data-t-label="fullOff" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path>
      </svg>
    </button>

    <!-- L'annuncio di ondata. Sta qui e non nei pixel del campo perché è testo, e il testo dentro
         un'immagine è una terza lingua da tenere allineata a mano. Sparisce da solo. -->
    <div class="herald" id="herald" hidden aria-hidden="true">
      <span class="herald-wave" id="heraldWave"></span>
      <strong class="herald-kind" id="heraldKind"></strong>
      <span class="herald-note" id="heraldNote"></span>
    </div>

    <!-- richiamo -->
    <section class="panel attract" data-screen="attract">
      <h1 class="title">SPRONIA</h1>
      <p class="sub" data-t="tagline"></p>
      <button type="button" id="coinButton" class="coin">
        <span class="coin-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M9.5 12h5M12 9.5v5"></path>
          </svg>
        </span>
        <span data-t="insertCoin"></span>
      </button>
      <p class="small" data-t="coinFree"></p>
      <p><button type="button" id="scoresButton" class="linkish" data-t="scoresTitle"></button></p>
    </section>

    <!-- credito -->
    <section class="panel" data-screen="credit">
      <div class="sheet">
        <p class="kicker"><span data-t="credits"></span> <b id="creditsBig">1</b></p>
        <h2 class="title small-title" data-t="pressStart"></h2>
        <p class="choose">
          <button type="button" id="play1" class="primary big" data-t="players1"></button>
          <button type="button" id="play2" class="big" data-t="players2"></button>
        </p>
        <p class="small" id="playersNote" data-t="playersNote" hidden></p>
        <p class="small" data-t="startHint"></p>

        <!-- I comandi per primi. Chi apre un gioco vuole sapere che tasti premere, non che cos'è la
             regola dell'altezza: quella la impara giocando, i tasti no. -->
        <div class="how">
          <h2 data-t="ctrlTitle"></h2>
          <ul>
            <li data-t="howKeys"></li>
            <li data-t="howKeys2"></li>
            <li data-t="howTouch"></li>
          </ul>
          <p><button type="button" id="keysButton" class="linkish" data-t="keysTitle"></button></p>

          <h2 data-t="flightTitle"></h2>
          <!-- La regola prima delle sue conseguenze. Questa riga esisteva ed era rimasta senza un
               posto quando il pannello è diventato quello del cabinato: una stringa tradotta due
               volte che non compariva da nessuna parte. -->
          <p class="rule" data-t="flightLead"></p>
          <ul>
            <!-- La conseguenza della regola prima delle cose che la circondano: dove guardare. -->
            <li data-t="howLance"></li>
            <li data-t="howBeat"></li>
            <li data-t="howSkid"></li>
            <li data-t="howCells"></li>
            <li data-t="howShield"></li>
            <li data-t="howIntruder"></li>
            <li data-t="howClaw"></li>
          </ul>
          <p class="small" data-t="a11yNote"></p>
        </div>
        <p><button type="button" id="backFromCredit" class="linkish" data-t="back"></button></p>
      </div>
    </section>

    <!-- pausa -->
    <section class="panel" data-screen="paused">
      <div class="sheet">
        <h2 class="title small-title" data-t="paused"></h2>
        <p>
          <button type="button" id="resumeButton" class="primary" data-t="resume"></button>
          <button type="button" id="quitButton" data-t="quit"></button>
        </p>
      </div>
    </section>

    <!-- fine partita -->
    <section class="panel" data-screen="over">
      <div class="sheet">
        <h2 class="title small-title" data-t="gameOver"></h2>
        <p id="overScore" class="lead"></p>
        <p id="overPlace" class="small"></p>
        <form id="nameform" class="nameform" autocomplete="off">
          <label for="namefield" data-t="nameLabel"></label>
          <input type="text" id="namefield" maxlength="12" enterkeyhint="done" spellcheck="false">
          <button type="submit" id="saveButton" class="primary" data-t="save"></button>
        </form>
        <p class="small" id="nameNote" data-t="nameNote"></p>

        <!-- La condivisione, e le due regole che la tengono onesta.
             Gli href sono normali: nessuno script di terze parti, come sugli articoli e sulla
             scheda. Il widget ufficiale di un social porta un tracker, e su un gioco che si vende
             dicendo di non mandare niente a nessuno sarebbe la contraddizione più visibile.
             E puntano alla **scheda**, mai a run/: l'app è noindex e il suo canonical nomina già la
             scheda, quindi un link verso run/ non accumula niente e scarica chi arriva dentro un
             attrezzo senza il testo che spiega cos'è. -->
        <div class="share" id="shareBox">
          <span class="share-label" data-t="shareTitle"></span>
          <a id="shareLinkedin" class="share-link" rel="noopener" target="_blank" data-t-label="shareOnLinkedin">in</a>
          <a id="shareX" class="share-link" rel="noopener" target="_blank" data-t-label="shareOnX">✕</a>
          <a id="shareMail" class="share-link" data-t-label="shareByMail">✉</a>
          <button type="button" id="shareCopy" class="share-link" data-t-label="shareCopy">⧉</button>
        </div>
        <p class="small" id="shareNote"></p>

        <p>
          <button type="button" id="coinAgain" class="linkish" data-t="playAgain"></button>
          ·
          <button type="button" id="scoresFromOver" class="linkish" data-t="scoresTitle"></button>
          <!-- Compare da solo quando il browser dice che si può installare, e sparisce quando è
               installata o quando hai risposto una volta. Della stessa taglia dei due accanto: è una
               cosa che si può fare adesso, non una che va fatta.
               Il punto che lo separa se lo porta dietro nel CSS, così compare e sparisce con lui
               senza che nessuno debba ricordarsi di nasconderlo. -->
          <button type="button" id="install" class="linkish" hidden></button>
        </p>
        <!-- Su iPhone non esiste nessun invito da rimandare: installare passa da Condividi, e
             l'unica cosa che si può fare è dirlo. Stessa riga, stesso momento. -->
        <p class="small" id="installHint" hidden></p>
      </div>
    </section>

    <!-- la classifica -->
    <section class="panel wide" data-screen="scores">
      <div class="sheet">
        <h2 class="title small-title" data-t="scoresTitle"></h2>
        <p class="small" data-t="scoresLocal"></p>
        <p class="small" id="storageNote" hidden data-t="storageOff"></p>
        <table class="scores">
          <thead>
            <tr>
              <th class="pos" data-t="scoresPos"></th>
              <th data-t="scoresName"></th>
              <th class="pts" data-t="scoresScore"></th>
              <th class="pts" data-t="scoresWave"></th>
              <th class="when" data-t="scoresDate"></th>
            </tr>
          </thead>
          <tbody id="scoreRows"></tbody>
        </table>
        <p class="small" id="scoresEmpty" data-t="scoresEmpty"></p>
        <p class="totals">
          <span><b id="statGames">0</b> <span data-t="statsGames"></span></span>
          <span><b id="statBest">1</b> <span data-t="statsBest"></span></span>
          <span><b id="statCoins">0</b> <span data-t="statsCoins"></span></span>
        </p>
        <p class="small" data-t="exportHint"></p>
        <p class="io">
          <button type="button" id="exportButton" class="accent" data-t="export"></button>
          <button type="button" id="importButton" data-t="import"></button>
          <button type="button" id="clearButton" data-t="clear"></button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </p>
        <p class="small" id="ioNote"></p>
        <p><button type="button" id="backFromScores" class="linkish" data-t="back"></button></p>
      </div>
    </section>

    <!-- i tasti -->
    <section class="panel wide" data-screen="keys">
      <div class="sheet">
        <h2 class="title small-title" data-t="keysTitle"></h2>
        <p class="small" data-t="keysIntro"></p>
        <div class="keymap" id="keymap"></div>
        <p class="small" id="keysNote"></p>
        <p class="io">
          <button type="button" id="keysReset" data-t="keysReset"></button>
          <button type="button" id="keysDone" class="primary" data-t="keysDone"></button>
        </p>
      </div>
    </section>
  </div>

  <!-- Quello che viene detto a uno screen reader. Un gioco in tempo reale non si può raccontare
       mentre succede; la fine di una partita sì, ed è quello che va qui invece di una telecronaca
       che nessuno riuscirebbe a seguire. -->
  <p class="sr-only" id="live" role="status" aria-live="polite"></p>
</main>

<footer class="foot">
  <a href="../" data-t="backToPage"></a>
  <span class="spacer"></span>
  <a href="https://github.com/G-G-Technologies-Srl/g-g-technologies-srl.github.io/tree/main/app/spronia"
     rel="noopener" data-t="sourceLabel"></a>
</footer>

<!-- Every import into the shared library goes through here, never up the tree. Both forms work
     identically today; the difference arrives the day _lib/ takes a version number, and it is one
     line per app instead of every import in every file. check_apps.py rejects the relative form. -->
<script type="importmap">
{ "imports": { "gg/": "../../_lib/" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
